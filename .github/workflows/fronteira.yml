name: Fronteira do conhecimento

# Working papers e revistas de pesquisa: NBER, BIS, ECB, FEDS, arXiv econometria, BCB, JME, QJE, RES, Econometrica.

on:
  schedule:
    # Sexta 07:00 UTC = 04:00 em Brasilia
    - cron: "0 7 * * 5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fronteira:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Buscar papers de fronteira
        run: python coletor.py fronteira

      - name: Salvar no repositorio
        run: |
          git config user.name "radar-macro-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add semana/fronteira.md estado/fronteira.json
          git diff --cached --quiet && exit 0
          git commit -m "Fronteira do conhecimento: $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 15
          done
          exit 1

